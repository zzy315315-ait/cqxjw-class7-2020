  .modal.warn .ok-btn{background:linear-gradient(135deg,#fbbf24,#f59e0b);box-shadow:0 4px 16px rgba(245,158,11,0.35)}

  /* 弹窗消失动画 */
  .modal-mask.closing{animation:fadeOut .45s ease-in forwards}

  @keyframes fadeOut{from{opacity:1}to{opacity:0}}

  .loading{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}

<script>
/* 直达检测：不是从主登录页跳转过来的，自动跳回主登录页 */
if(!sessionStorage.getItem('from_login')){
  window.location.href = "index.html";
}

/* ============================================================
   内部人员登录 - 支持 名字/学号/邮箱 三种输入
   ============================================================ */

var _u = "https://ekfntkpjqzmkibdimtru.supabase.co";
var _k = "sb_publishable_Z3wpxD9ZRbXm9-gPPQOGZg_KKhr_yIs";
var _r = "https://cqxjw-class7-2020-2.pages.dev/a3x7k2m9p4q8r3t6w1y5u0i2o4.html";
var _adminUid = "919f3af0-801d-4d7b-87b4-03bedc9d2896";

// 名字→学号映射表
var _m = {
  "杨明叡":"1","李梓豪":"2","陶柏彦":"3","李镇宇":"4","张清源":"5","周兴":"6",
  "唐颢原":"7","罗楚天":"8","李昊辰":"9","陈俊宇":"10","刘培正":"11","周子义":"12",
  "张泽棵":"13","李宗潮":"14","孙榆桐":"15","刘琨正":"16","陈俊晓":"17","李博宇":"18",
  "毛艺杰":"19","罗迦蓝":"20","赵梓成":"21","陆蔼琳":"22","叶梦涵":"23","种沁佳":"24",
  "王正玟":"25","黄可嘉":"26","陈夏":"27","周芷觅":"28","王乙棠":"29","杨云迪":"30",
  "孟姝菡":"31","莫钕忱":"32","黄圣意":"33","叶诗颖":"34","郭梓琳":"35","官琬钰":"36",
  "熊湙铃":"37","吴苓萁":"38","张景怡":"39","樊禹希":"40","陈以柔":"41","陈诗颖":"42"
};

// 检测输入格式
function _f(_x){
  if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(_x)) return "email";
  if(/^\d+$/.test(_x)) return "sid";
  return "name";
}

// 转换为邮箱
function _e(_x, _t){
  if(_t === "email") return _x;
  if(_t === "sid") return _x + "@class20207.com";
  // name - 先去除首尾空格，统一处理
  _x = _x.trim();
  // 邓老师检测
  if(_x === "邓老师" || (_x.indexOf("邓") >= 0 && _x.length <= 4)){
    return "denglaoshi@class20207.com";
  }
  // 精确匹配
  var _s = _m[_x];
  if(_s) return _s + "@class20207.com";
  // 模糊匹配：去除空格后匹配
  var _clean = _x.replace(/\s/g, "");
  for(var _n in _m){
    if(_n.replace(/\s/g, "") === _clean){
      return _m[_n] + "@class20207.com";
    }
  }
  // 包含匹配：输入的名字是映射表中名字的子串（或反之）
  for(var _n2 in _m){
    if(_n2.indexOf(_x) >= 0 || _x.indexOf(_n2) >= 0){
      return _m[_n2] + "@class20207.com";
    }
  }
  return null;
}

// 判断角色（admin 或 super_admin 都算管理员，都会被卡住）
function _role(_uid, _email, _meta){
  // 固定UID白名单
  if(_uid && _uid.toLowerCase() === _adminUid.toLowerCase()) return "admin";
  // user_metadata.role 检查
  if(_meta && _meta.role){
    var _r = _meta.role.toLowerCase();
    if(_r === "admin" || _r === "super_admin") return "admin";
    if(_r === "unrestricted") return "unrestricted";
    if(_r === "other") return "other";
    if(_r === "teacher") return "teacher";
  }
  // 从邮箱判断老师/学生
  if(_email === "denglaoshi@class20207.com") return "teacher";
  // 其他用户（非班级邮箱）默认为other
  if(_email && _email.indexOf('@class20207.com') < 0 && _email !== "denglaoshi@class20207.com"){
    return "other";
  }
  return "student";
}

// 根据邮箱获取显示名
function _dn(_email){
  if(_email === "denglaoshi@class20207.com") return "邓老师";
  var _sid = _email.split("@")[0];
  for(var _n in _m){
    if(_m[_n] === _sid) return _n;
  }
  return _sid;
}

// 登录
function doLogin(){
  var _acc = document.getElementById("accInput").value.trim();
  var _pwd = document.getElementById("pwdInput").value;
  var _btn = document.getElementById("loginBtn");
  var _accEl = document.getElementById("accInput");
  var _pwdEl = document.getElementById("pwdInput");

  // ===== 登录频率限制：一分钟内失败超5次，封禁一分钟 =====
  var _fails = JSON.parse(localStorage.getItem('login_fails_internal') || '[]');
  var _now = Date.now();
  _fails = _fails.filter(function(t){ return _now - t < 60000; });
  localStorage.setItem('login_fails_internal', JSON.stringify(_fails));
  if(_fails.length >= 5){
    var _wait = Math.ceil((60000 - (_now - _fails[0])) / 1000);
    showModal("error","⏳","登录太频繁了","请等待 " + _wait + " 秒后再试<span class='detail'>一分钟内最多尝试5次，防止暴力破解</span>");
    return;
  }

  if(!_acc){
    _accEl.classList.add("shake");
    setTimeout(function(){_accEl.classList.remove("shake")},400);
    showModal("error","🤔","还没填名字呢","名字、学号或者邮箱，总得填一个吧");
    return;
  }
  if(!_pwd){
    _pwdEl.classList.add("shake");
    setTimeout(function(){_pwdEl.classList.remove("shake")},400);
    showModal("error","🔑","密码还没填","密码不能为空哦");
    return;
  }

  var _type = _f(_acc);
  var _email = _e(_acc, _type);
  if(!_email){
    _accEl.classList.add("shake");
    setTimeout(function(){_accEl.classList.remove("shake")},400);
    showModal("error","🔍","没找到这个人","班上好像没有叫这个名字的同学，检查一下有没有写错<span class='detail'>名字、学号、邮箱都可以哦</span>");
    return;
  }

  _btn.disabled = true;
  _btn.innerHTML = '<span class="loading"></span>验证中...';

  fetch(_u + "/auth/v1/token?grant_type=password", {
    method:"POST",
    headers:{"apikey":_k,"Content-Type":"application/json"},
    body:JSON.stringify({email:_email, password:_pwd})
  })
  .then(function(res){ return res.json().then(function(d){ return {status:res.status, data:d}; }); })
  .then(function(result){
    _btn.disabled = false;
    _btn.innerHTML = "登 录";

    if(result.status === 200 && result.data.access_token){
      var _uid = result.data.user ? result.data.user.id : "";
      var _meta = result.data.user ? result.data.user.user_metadata : null;
      var _r2 = _role(_uid, _email, _meta);
      var _name = _dn(_email);

      // 管理员误入 → 卡住
      if(_r2 === "admin"){
        showModal("warn","🔒","哎，你是管理员","这个入口是给同学和老师用的<span class='detail'>返回主页，点「是管理员？点这里」进去吧</span>");
        return; // 不跳转，不保存session
      }

      // 保存会话
      try{
        var _sid = '';
        if(_email && _email.indexOf('@class20207.com') > 0 && _email !== 'denglaoshi@class20207.com'){
          _sid = _email.split('@')[0];
        }
        localStorage.setItem("sb_session", JSON.stringify({
          token:result.data.access_token,
          uid:_uid,
          name:_name,
          role:_r2,
          email:_email,
          student_id:_sid,
          exp:Date.now() + 3600000
        }));
      }catch(e){}

      // 登录成功，清空失败记录
      localStorage.removeItem('login_fails_internal');

      // ===== 登录次数检查：第一次提醒改密码，第二次强制改密码 =====
      // 优先从用户元数据（数据库）读取是否已改密码，避免跨域localStorage丢失
      var _pwdChanged = (_meta && (_meta.password_changed === true || _meta.password_changed === '1')) ? '1' : localStorage.getItem('pwd_changed_' + _uid);
      var _loginCount = parseInt(localStorage.getItem('login_count_' + _uid) || '0') + 1;
      localStorage.setItem('login_count_' + _uid, String(_loginCount));
      var _forceChangePwd = false;
      var _pwdHint = '';
      if(!_pwdChanged && _r2 !== 'unrestricted'){
        if(_loginCount >= 2){
          _forceChangePwd = true;
          _pwdHint = '为了账号安全，请先修改默认密码';
        }else if(_loginCount === 1){
          _pwdHint = '建议修改默认密码，保护账号安全';
        }
      }

      // 根据登录方式显示不同提示
      if(_type === "email"){
        var _hint = "";
        if(_r2 === "teacher"){
          _hint = "登录成功。为了账号安全，建议下次登录使用姓名";
        }else{
          _hint = "登录成功。为了账号安全，建议下次登录使用姓名或者学号";
        }
        if(_pwdHint) _hint += '<br><span style="color:#fbbf24">' + _pwdHint + '</span>';
        showModal("success","✅","登录成功，欢迎" + _name + "！",_hint);
      }else{
        var _detail = "欢迎回来，" + _name + "！";
        if(_pwdHint) _detail += '<br><span style="color:#fbbf24">' + _pwdHint + '</span>';
        showModal("success","✅","登录成功",_detail);
      }
      // 停留2秒后淡出，再跳转
      setTimeout(function(){
        document.getElementById("modalMask").classList.add("closing");
        document.getElementById("modalBox").classList.add("closing");
        // 普通用户默认不保持登录（使用sessionStorage，关闭浏览器自动退出）
        sessionStorage.setItem('logged_in', '1');
        var _rawTarget = _forceChangePwd ? 'https://cqxjw-class7-2020-4.pages.dev/change-password.html?force=1' : _r;
        var _target = (typeof CrossDomainAuth !== 'undefined') ? CrossDomainAuth.buildUrl(_rawTarget) : _rawTarget;
        if(_forceChangePwd){
          sessionStorage.setItem('force_change_pwd', '1');
        }
        setTimeout(function(){ window.location.href = _target; }, 450);
      }, 2000);
    }else{
      // 记录登录失败时间戳
      var _fails = JSON.parse(localStorage.getItem('login_fails_internal') || '[]');
      _fails.push(Date.now());
      localStorage.setItem('login_fails_internal', JSON.stringify(_fails));

      var _err = "密码错误，请重新输入";
      if(result.data && result.data.error_description){
        _err = result.data.error_description;
      }
      _pwdEl.classList.add("shake");
      setTimeout(function(){_pwdEl.classList.remove("shake")},400);
      showModal("error","❌","登录失败","密码错误，请重新输入<span class='detail'>默认密码是学号，改过的话用新密码</span>");
    }
  })
  .catch(function(err){
    _btn.disabled = false;
    _btn.innerHTML = "进 入";
    showModal("error","🌐","网络异常","无法连接到服务器，请检查网络连接后重试<span class='detail'>" + err.message + "</span>");
  });
}

function goBack(){ window.location.href = "login.html"; }

function updateClock(){
  var now = new Date();
  var weeks = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  document.getElementById("weekday").textContent = weeks[now.getDay()];
  var h = String(now.getHours()).padStart(2,"0");
  var m = String(now.getMinutes()).padStart(2,"0");
  var s = String(now.getSeconds()).padStart(2,"0");
  document.getElementById("time").textContent = h + ":" + m + ":" + s;
}
updateClock();
setInterval(updateClock, 1000);

function showModal(type, icon, title, detail){
  var box = document.getElementById("modalBox");
  box.className = "modal " + type;
  document.getElementById("modalIcon").textContent = icon;
  document.getElementById("modalMsg").innerHTML = title + (detail ? "<span class='detail'>" + detail + "</span>" : "");
  document.getElementById("modalMask").classList.add("show");
}
function closeModal(){ document.getElementById("modalMask").classList.remove("show"); }

document.getElementById("pwdInput").addEventListener("keydown", function(e){
  if(e.key === "Enter") doLogin();
});
document.getElementById("accInput").addEventListener("keydown", function(e){
  if(e.key === "Enter") document.getElementById("pwdInput").focus();
});
</script>
